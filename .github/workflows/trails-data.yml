name: Fetch trail relief data
on:
  push:
    branches: [trails-data]
    paths: ["tools/**", ".github/workflows/trails-data.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rasterio numpy pillow
      - run: python tools/fetch_data.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-raw
          git commit -m "Trail relief raw data" || echo "nothing to commit"
          git push
