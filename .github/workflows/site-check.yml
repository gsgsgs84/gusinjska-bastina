name: Check the live site
on:
  push:
    branches: [trails-data]
    paths: [".github/workflows/site-check.yml", "tools/site_check.sh"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/site_check.sh > site-check.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-check.txt
          git commit -m "Live site check" || echo "nothing to commit"
          git push
