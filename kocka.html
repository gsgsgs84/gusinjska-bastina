<!doctype html>
<html lang="sr-ME">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Muzej na kocki · Gusinjska kulturna baština</title>
<meta name="description" content="Exhibits of the Gusinje museum on a printed AR cube, in your phone's browser (Safari on iPhone, Chrome on Android).">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="css/fonts/Marcellus.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="css/ar-kocka.css">
<script type="importmap">{"imports":{"three":"./js/vendor/three/three.module.min.js","three/addons/":"./js/vendor/three/addons/"}}</script>
<script type="module" src="js/kocka/app.js"></script>
</head>
<body>
<!-- the camera video stays on the page (Safari pauses muted videos that are not); the canvas draws over it -->
<video id="cam" playsinline muted autoplay disablepictureinpicture></video>
<canvas id="gl" aria-label="AR"></canvas>
<canvas id="dbg" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>

<!-- ============ start ============ -->
<section id="start">
  <header class="st-top">
    <a class="st-logo" href="index.html" aria-label="Gusinjska kulturna baština"><img src="icons/xplore-prokletije-light.svg" alt="Xplore Prokletije" width="118" height="48"></a>
    <div class="lang" role="group" data-t-aria="language">
      <button data-l="me">ME</button><button data-l="sq">SQ</button><button data-l="en">EN</button>
    </div>
  </header>
  <div class="st-stage" aria-hidden="true"><span id="stName" class="st-name"></span></div>
  <div class="st-body">
    <p class="st-kicker" data-t="kicker"></p>
    <h1 data-t="title"></h1>
    <p class="st-lead" data-t="lead"></p>
    <div id="inapp" class="note warn" hidden>
      <p data-t="inApp"></p>
      <div class="row-btns"><a id="openChrome" class="btn ghost" hidden data-t="openChrome"></a><button id="btnCopy" class="btn ghost" data-t="copyLink"></button></div>
    </div>
    <button class="btn primary" id="go">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3V19H4z"/><circle cx="12" cy="13.2" r="3.4"/></svg>
      <span data-t="start"></span>
    </button>
    <div id="err" class="note err" role="alert" hidden></div>
    <div class="st-links">
      <button id="btnNoCube" class="link" data-t="noCube"></button>
      <a class="link" href="index.html" data-t="backMuseum"></a>
    </div>
    <p class="st-privacy" data-t="privacy"></p>
  </div>
  <div class="kilim st-kilim" aria-hidden="true"></div>
</section>

<!-- ============ AR ============ -->
<header id="hud" hidden>
  <a class="rbtn" href="index.html" data-t-aria="museum">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <div id="status" class="pill" aria-live="polite"><i class="dot"></i><span id="statusText"></span></div>
  <div class="hud-r">
    <button class="rbtn" id="btnHelp" data-t-aria="how"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.7 9.4a2.4 2.4 0 1 1 3.4 2.2c-.7.3-1.1.9-1.1 1.6v.4"/><path d="M12 16.6v.2"/></svg></button>
    <button class="rbtn" id="btnSettings" data-t-aria="settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </div>
</header>

<div id="side" hidden>
  <button id="btnSpin" class="rbtn act"><i></i></button>
  <button id="btnPlace" class="rbtn act"><i></i></button>
  <button id="btnVitrine" class="rbtn act"><i></i></button>
  <button class="rbtn" id="btnCam" hidden data-t-aria="camera"><svg viewBox="0 0 24 24"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3V19H4z"/><path d="M9.6 12.6a2.6 2.6 0 0 1 4.4-1.3M14.4 14.6a2.6 2.6 0 0 1-4.4 1.1"/></svg><b id="camNo"></b></button>
  <button class="rbtn txt" id="btnZoom" data-t-aria="zoomOut">1×</button>
  <button id="btnPhoto" class="shutter" data-t-aria="photo"><span></span></button>
</div>

<div id="hint" class="off" aria-hidden="true">
  <div class="reticle"><svg viewBox="0 0 120 120"><path class="c1" d="M60 16 98 38v44L60 104 22 82V38z"/><path class="c2" d="M22 38l38 22 38-22M60 60v44"/></svg></div>
  <p id="tip"></p>
</div>

<button id="stall" class="note warn" hidden data-t="stalled"></button>
<div id="badge" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"></div>

<section id="panel" hidden>
  <div id="loadBar" class="kilim" aria-hidden="true"></div>
  <div class="ex" id="exCard">
    <button class="nav" id="btnPrev" aria-label="‹"><svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg></button>
    <button class="ex-text" id="exText">
      <span id="exGallery" class="ex-gal"></span>
      <span id="exName" class="ex-name"></span>
      <span id="exSub" class="ex-sub"></span>
    </button>
    <button class="nav" id="btnNext" aria-label="›"><svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg></button>
    <button class="info" id="btnInfo" data-t-aria="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.2"/></svg></button>
  </div>
  <div class="collection">
    <div class="chips" id="galChips"></div>
    <div class="strip" id="strip"></div>
  </div>
  <button id="btnStrip" class="grab" aria-expanded="true"><span></span></button>
</section>

<!-- ============ sheets ============ -->
<div class="scrim" id="scrim"></div>

<section class="sheet" id="sheetInfo" aria-hidden="true">
  <div class="grip"></div>
  <div class="info-head">
    <img id="infoThumb" alt="" width="84" height="84">
    <div><p id="infoGallery" class="sh-gal"></p><h2 id="infoTitle"></h2><p id="infoSub" class="sh-sub"></p></div>
  </div>
  <p id="infoDesc" class="story"></p>
  <dl id="infoKv" class="kv"></dl>
  <div class="row-btns"><a id="infoLink" class="btn ghost" data-t="openInMuseum"></a><button class="btn ghost" data-close data-t="close"></button></div>
</section>

<section class="sheet" id="sheetSettings" aria-hidden="true">
  <div class="grip"></div>
  <h2 data-t="settings"></h2>
  <div class="srow"><div><b data-t="language"></b></div><div class="seg lang"><button data-l="me">ME</button><button data-l="sq">SQ</button><button data-l="en">EN</button></div></div>
  <div class="srow"><div><b data-t="plinth"></b><small data-t="plinth2"></small></div>
    <div class="seg" id="segPlinth"><button data-v="stone" data-t="stone"></button><button data-v="marble" data-t="marble"></button><button data-v="wood" data-t="wood"></button><button data-v="none" data-t="none"></button></div></div>
  <div class="srow"><div><b data-t="position"></b><small data-t="position2"></small></div>
    <div class="seg" id="segPlace"><button data-v="top" data-t="onCube"></button><button data-v="hand" data-t="inHand"></button></div></div>
  <div class="srow"><label for="chkUpright"><b data-t="upright"></b><small data-t="upright2"></small></label><span class="switch"><input type="checkbox" id="chkUpright"><span></span></span></div>
  <div class="srow"><label for="chkShadow"><b data-t="shadows"></b></label><span class="switch"><input type="checkbox" id="chkShadow"><span></span></span></div>
  <div class="srow"><div><b data-t="view"></b><small data-t="view2"></small></div>
    <div class="seg" id="segView"><button data-v="fill" data-t="fill"></button><button data-v="fit" data-t="whole"></button></div></div>
  <div class="srow"><div><b data-t="zoomOut"></b></div>
    <div class="seg" id="segZoom"><button data-v="1">1×</button><button data-v="0.7">.7×</button><button data-v="0.5">.5×</button></div></div>
  <div class="srow" id="rowCam" hidden><div><b data-t="camera"></b><small data-t="camera2"></small></div><div class="seg wrap" id="segCam"></div></div>
  <div class="srow"><div><b data-t="fov"></b><small id="fovVal"></small></div><button class="btn ghost sm" id="btnFovReset" data-t="resetFov"></button></div>
  <div class="srow"><label for="chkDebug"><b data-t="debug"></b><small data-t="debug2"></small></label><span class="switch"><input type="checkbox" id="chkDebug"><span></span></span></div>
  <p class="foot"><span id="detVal"></span> · v<span id="ver"></span> · <a href="kocka-stara.html" data-t="oldVersion"></a></p>
</section>

<section class="sheet" id="sheetHelp" aria-hidden="true">
  <div class="grip"></div>
  <h2 data-t="how"></h2>
  <ol class="steps"><li data-t="h1"></li><li data-t="h2"></li><li data-t="h3"></li><li data-t="h4"></li><li data-t="h5"></li></ol>
  <div class="row-btns"><button class="btn ghost" onclick="document.getElementById('btnNoCube').click()" data-t="printTitle"></button><button class="btn ghost" data-close data-t="close"></button></div>
  <p class="foot" data-t="privacy"></p>
</section>

<section class="sheet" id="sheetPrint" aria-hidden="true">
  <div class="grip"></div>
  <h2 data-t="printTitle"></h2>
  <p class="sh-sub" data-t="printLead"></p>
  <div class="files">
    <a href="print/AR_cube_paper_test.pdf" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg><span data-t="pdf"></span></a>
    <a href="print/AR_cube_70mm_2colour.3mf" download><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg><span data-t="f3mf"></span></a>
    <a href="print/AR_cube_70mm_STL.zip" download><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg><span data-t="stl"></span></a>
  </div>
  <div class="row-btns"><button class="btn ghost" data-close data-t="close"></button></div>
</section>

<section class="sheet" id="sheetPhoto" aria-hidden="true">
  <div class="grip"></div>
  <h2 data-t="photoTitle"></h2>
  <img id="photoImg" alt="">
  <div class="row-btns"><button class="btn primary sm" id="photoShare" data-t="share"></button><a class="btn ghost" id="photoSave" data-t="save"></a><button class="btn ghost" data-close data-t="close"></button></div>
</section>
</body>
</html>
