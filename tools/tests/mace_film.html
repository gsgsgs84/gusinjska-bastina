<!doctype html>
<!-- Renders the test room as a fake phone-camera video (frames for tools/tests/mace_video.cjs). -->
<html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"../../js/vendor/three/three.module.min.js","three/addons/":"../../js/vendor/three/addons/"}}</script>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { buildDemoRoom } from '../../js/mace-demo.js';
const W = 640, H = 480;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setPixelRatio(1); r.outputColorSpace = THREE.SRGBColorSpace; r.shadowMap.enabled = true;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xd8d0c2);
const room = buildDemoRoom(); scene.add(room.group);
scene.add(new THREE.HemisphereLight(0xfffaf0, 0x8d8272, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.9); sun.position.set(1.5, 3.2, 1.0); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 8 }); scene.add(sun);
const cam = new THREE.PerspectiveCamera(50, W / H, 0.05, 30);       // about a phone's main camera (4:3)
const ease = x => x * x * (3 - 2 * x);
const lerp = (a, b, f) => a + (b - a) * f;
// keyframes: [t, x, y, z, yaw, pitch]; starts looking at the floor, slides sideways, sweeps the room, comes back
const K = [
  [0, 0, 1.4, 1.0, 0, -0.95], [2.5, 0, 1.4, 1.0, 0, -0.95], [6, 0.35, 1.38, 0.95, 0.05, -0.85],
  [9, 0.3, 1.38, 0.8, 0.55, -0.55], [13, 0.1, 1.35, 0.7, 1.05, -0.45], [17, -0.15, 1.35, 0.6, 0.2, -0.35],
  [21, -0.3, 1.33, 0.6, -0.7, -0.45], [25, -0.35, 1.3, 0.75, -1.15, -0.4], [29, -0.1, 1.35, 0.85, -0.4, -0.6],
  [33, 0.15, 1.38, 0.9, 0.3, -0.5], [37, 0.0, 1.4, 1.0, 0, -0.75], [40, 0, 1.4, 1.0, 0, -0.95],
];
window.render = t => {
  let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
  const a = K[i], b = K[i + 1], f = ease(Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0]))));
  const v = a.map((x, j) => lerp(x, b[j], f));
  // a little hand shake
  cam.position.set(v[1] + Math.sin(t * 5.1) * 0.004, v[2] + Math.sin(t * 6.3) * 0.003, v[3] + Math.sin(t * 4.2) * 0.003);
  cam.rotation.set(v[5] + Math.sin(t * 3.7) * 0.004, v[4] + Math.sin(t * 2.9) * 0.004, 0, 'YXZ');
  r.render(scene, cam);
  return r.domElement.toDataURL('image/jpeg', 0.9);
};
window.ready = true;
</script></body></html>
